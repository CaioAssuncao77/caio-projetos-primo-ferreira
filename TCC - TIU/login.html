site <!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TIU - Login</title>



    <link rel="stylesheet" href="style.css">

</head>

<body>



    <header>

        <nav class="navbar">

            <h1>TIU</h1>



            <div class="nav-links">

                <a href="index.html">Início</a>

                <a href="#">Contatos</a>

            </div>

        </nav>

    </header>



    <main class="container">



        <div class="login-card">



            <h2>Bem-vindo de volta!</h2>

            <p>Faça login para continuar.</p>



            <form>



                <label for="email">E-mail</label>

                <input

                    type="email"

                    id="email"

                    placeholder="Digite seu e-mail"

                    required

                >



                <label for="senha">Senha</label>

                <input

                    type="password"

                    id="senha"

                    placeholder="Digite sua senha"

                    required

                >



                <button type="submit">

                    Entrar

                </button>



            </form>



            <div class="extra-links">

               

                <a href="forgotSenha.html">Esqueceu sua senha?</a>



                <p>Ainda não é um usuário? <a href="cadastro.html">Cadastre-se</a></p>

            </div>



            <hr>



            <div class="contatos">

                <h3>Contatos</h3>



                <p>Email: suporte@tiu.com</p>

                <p>Telefone: (13) 99999-9999</p>

            </div>



        </div>



    </main>



</body>

</html>
